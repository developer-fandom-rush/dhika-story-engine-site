<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHIKA Story Engine · E02 Review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#24302b;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{background:#1d332b;color:#fff;padding:20px 24px}h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#cbd8d2;font-size:13px}.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.parts button{border:1px solid #507166;background:#29473c;color:#fff;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}.parts button.active{background:#fff;color:#1d332b}.parts button:disabled{opacity:.48;cursor:not-allowed}.status{padding:9px 24px;background:#ebe6da;border-bottom:1px solid #d9d2c4;font-size:12px;color:#59645f}.status b{color:#315b4c}iframe{display:block;width:100%;min-height:900px;border:0;background:#f5f2e9}</style>
</head>
<body>
<header><h1>DHIKA Story Engine · Original Episode 02</h1><p>Source-locked episode map: 14 approved scene-bounded Parts covering the complete episode.</p><div class="parts">
<button class="active" data-file="part1.html">Part 1 · L9–17</button>
<button data-file="part2.html">Part 2 · L18–24</button><button data-file="part3.html">Part 3 · L25–36</button><button data-file="part4.html">Part 4 · L37–48</button><button data-file="part5.html">Part 5 · L49–57</button><button data-file="part6.html">Part 6 · L58–67</button><button data-file="part7.html">Part 7 · L68–76</button><button data-file="part8.html">Part 8 · L77–82</button><button data-file="part9.html">Part 9 · L83–103</button><button data-file="part10.html">Part 10 · L104–113</button><button data-file="part11.html">Part 11 · L114–119</button><button data-file="part12.html">Part 12 · L120–139</button><button data-file="part13.html">Part 13 · L140–153</button><button data-file="part14.html">Part 14 · L154–159 · END</button>
</div></header>
<div class="status">Architecture: <b>index.html = router only</b> · 160 registered entries · wrapper L1–8 · story L9–159 · L160 empty terminator · images handled by separate asset handoff</div>
<iframe id="partView" src="part1.html" title="Episode 02 Part 1 review"></iframe>
<script>const buttons=[...document.querySelectorAll('.parts button')],frame=document.getElementById('partView');function openPart(button){buttons.forEach(b=>b.classList.toggle('active',b===button));if(frame.getAttribute('src')!==button.dataset.file)frame.src=button.dataset.file;history.replaceState(null,'','#'+button.dataset.file.replace('.html',''))}buttons.forEach(b=>b.addEventListener('click',()=>openPart(b)));frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const resize=()=>frame.style.height=Math.max(900,doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px';resize();new ResizeObserver(resize).observe(doc.body);doc.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a){const href=a.getAttribute('href');const button=buttons.find(b=>b.dataset.file===href);if(button){e.preventDefault();openPart(button);return}if(href==='index.html'){e.preventDefault();return}}setTimeout(resize,50)});}catch(e){}});const initial=buttons.find(b=>b.dataset.file===location.hash.slice(1)+'.html')||buttons[0];openPart(initial);</script>
</body></html>
