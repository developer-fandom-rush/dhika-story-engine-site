const frame=document.getElementById('view'),loading=document.getElementById('loading');
function prepare(html){const d=new DOMParser().parseFromString(html,'text/html');d.querySelector('header')?.remove();const nav=d.querySelector('nav');if(nav){const ep=[...nav.querySelectorAll('button')].find(b=>b.dataset.tab==='Episode Review');const rq=[...nav.querySelectorAll('button')].find(b=>b.dataset.tab==='Reader Questions');const qa=[...nav.querySelectorAll('button')].find(b=>b.dataset.tab==='QA');if(ep&&rq)ep.after(rq);if(rq&&qa)rq.after(qa);const ov=[...nav.querySelectorAll('button')].find(b=>b.dataset.tab==='Overview');if(ov)ov.textContent='Scope / Status';}return '<!doctype html>'+d.documentElement.outerHTML}
fetch(RAW).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{frame.srcdoc=prepare(html);loading.remove()}).catch(()=>{loading.textContent='Part 1 view could not load. Refresh this page.'});
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const resize=()=>frame.style.height=Math.max(800,doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px';resize();new ResizeObserver(resize).observe(doc.body);doc.addEventListener('click',()=>setTimeout(resize,40));}catch(e){}});
</script></body></html>
