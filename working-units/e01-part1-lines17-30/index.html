const translations={
'L31–35':`<div class="range">L31–35</div>Subah 8:35 baje Dhika ne college parking mein apni bike lagayi hi thi ki peeche se ek awaaz aayi…<br>Bantu: Aaj bahut pretty lag rahi hain, Miss…<br>Bantu: Bilkul kal ki tarah… aur usse ek din pehle ki tarah…<br>Dhika sharma gayi: Ai… shhh!!<br>Mudne se pehle hi use pata tha kaun hai. Bas woh yahi umeed kar rahi thi ki aas-paas koi aur na ho.`,
'L36–39':`<div class="range">L36–39</div>Har koi Dhika se is tarah baat nahi kar sakta tha, lekin uske favourite twins ko uske saath kuch khaas chhoot mili hui thi.<br>Dhika: Good morning dear, Bobby kahan hai?<br>Bantu: Wahan hai, Miss.<br>Dhika ne sir ghumaya aur thoda door apni bike dhakka dete hue joojh rahe Bobby ko haath hila kar wave kiya.`,
'L40–43':`<div class="range">L40–43</div>Bantu aur Bobby twins the aur Dhika ke sabse favourite students. Dono bahut padhaku the aur hamesha uske aas-paas rehte the. Bantu zyada tar aage-aage rehta aur Bobby aksar uske saath chalta.<br>Bantu charming tha, hamesha bolne wala, aur logon ke chehre par smile lana jaanta tha. Bobby bahut shy tha, lekin timid bilkul nahi; woh khulkar baat karta tha, par zyada tar Bantu se, aur yahi baat Dhika ko curious karti thi.<br>Dono favourites mein Dhika ko Bobby thoda zyada pasand tha—ek toh woh thoda chubby tha, aur doosra, uske saamne aur bhi shy ho jata tha.<br>Bantu apni teacher ko roz compliment karna kabhi nahi bhoolta tha. Shuru mein jab woh use pretty kehta tha toh Dhika uncomfortable hoti thi; dheere-dheere, Bantu ke favourite hone aur aadat padne ke saath, use woh achha lagne laga aur ab woh mann hi mann us compliment ka intezar karti thi.`,
'L44–46':`<div class="range">L44–46</div>Dhika: Saree aap par bahut achhi lag rahi hai, Miss…<br>Dhika: Ai… bas karo. Ab class mein jao…<br>Waise… woh galat bhi nahi tha…`,
'L47–52':`<div class="range">L47–52</div>Aaj Dhika ne ek khoobsurat pink cotton saree pehni thi aur uske baal khule hue curls mein the. Conservative teacher apni conservative dress mein bhi aisi lag rahi thi ki log ek baar dekhkar dobara dekhe bina na reh saken—chamakta hua oval chehra, sparkling aankhen, chhoti si sharp naak aur bhare hue hont… uski khoobsurti ka zikr chalta hi ja sakta tha.<br>Aur baat sirf looks ki nahi thi.<br>Dhika hamesha muskurati rehti thi aur uske aas-paas ek positive vibe thi. Woh kisi ko daantti nahi thi, isi wajah se students use bahut pasand karte the.<br>Woh kind-hearted thi, nature se shy aur thodi si innocent, lekin duniya ki kuch baaton se bilkul anjaan bhi nahi thi.<br>Use unwanted attention milti rehti thi aur woh jaanti thi ki bahut se log use palat kar dekhte hain. Phir bhi woh apne manners aur kapdon ko bahut sambhal kar rakhti thi, taaki kisi ke andar koi unnecessary feeling na jagaye.<br>Ghar ke alawa woh hamesha full saree ya shawl ke saath kurti pehenti thi; apartment mein Aunty ne bhi use kabhi bina shawl nahi dekha tha.`,
'L53–60':`<div class="range">L53–60</div>Sharmi: Oi, Big Girl…<br>Dhika: Ahh… heyyyy…<br>Dhika ki kamar mein pinch karte hue ek bubbly si ladki uske paas aa lagi.<br>Sharmi Dhika ki bachpan ki dost, college mate aur best friend thi. Woh bhi Dhika jitni hi good-hearted thi, bas utni shy nahi. Uski aankhen Dhika se bhi badi thi, hont aur bhare hue, aur uski aankhon aur honton mein hamesha shararat chamakti rehti thi.<br>Rich background se hone ke bawajood Sharmi ne kabhi Dhika ke saamne uska dikhawa nahi kiya. Apni dost ke saath rehne ke liye usne usi college mein job le li thi jahan Dhika padhati thi.<br>Dhika ke bilkul ulat, Sharmi conservative nahi thi. Woh naughty, modern thi aur college mein sleeveless blouses pehenti thi.<br>Sharmi khud bhi kaafi attractive thi, phir bhi mazaak-mazaak mein Dhika se thodi jealous rehti thi, kyunki Dhika sir se pair tak dhaki rehkar bhi zyada attractive lagti thi aur uske kaafi fan followers the. Sharmi ke husband Raj ne bhi Dhika ki beauty ki tareef ki thi, aur Sharmi jaanti thi ki Raj ko impress karna kitna mushkil tha.`,
'L61–64':`<div class="range">L61–64</div>Sharmi Dhika ko hamesha mazaak mein chhedti thi ki Dhika ke paas ek cheez usse kaafi badi hai.<br>Dhika: Hehe, dhatt… subah-subah shuru mat ho ja.<br>Dhika: Jaise tumhare paas bhi kuch hai jo zyada logon se bada hai… usne jeebh nikaali.<br>Dono hanste-khilkhilate college ke andar chale gaye.`
