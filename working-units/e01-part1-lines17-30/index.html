<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHIKA Story Engine · E01 Review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#24302b;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{background:#1d332b;color:#fff;padding:20px 24px}h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#cbd8d2;font-size:13px}.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.parts button{border:1px solid #507166;background:#29473c;color:#fff;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}.parts button.active{background:#fff;color:#1d332b}.status{padding:9px 24px;background:#ebe6da;border-bottom:1px solid #d9d2c4;font-size:12px;color:#59645f}.status b{color:#315b4c}iframe{display:block;width:100%;min-height:900px;border:0;background:#f5f2e9}</style>
</head>
<body>
<header><h1>DHIKA Story Engine · Episode 01</h1><p>Complete source-locked episode map: prologue plus 12 scene-bounded parts.</p><div class="parts"><button data-file="prologue.html" data-key="prologue">Prologue · L1–16</button><button data-file="part1.html" data-key="part1">Part 1 · L17–30</button><button data-file="part2.html" data-key="part2">Part 2 · L31–64</button><button data-file="part3.html" data-key="part3">Part 3 · L65–70</button><button data-file="part4.html" data-key="part4">Part 4 · L71–107</button><button data-file="part5.html" data-key="part5">Part 5 · L108–117</button><button data-file="part6.html" data-key="part6">Part 6 · L118–128</button><button data-file="part7.html" data-key="part7">Part 7 · L129–141</button><button data-file="part8.html" data-key="part8">Part 8 · L142–158</button><button data-file="part9.html" data-key="part9">Part 9 · L159–170</button><button data-file="part10.html" data-key="part10">Part 10 · L171–194</button><button data-file="part11.html" data-key="part11">Part 11 · L195–207</button><button data-file="part12.html" data-key="part12">Part 12 · L208–225 · END</button></div></header>
<div class="status">Architecture: <b>index.html = router only</b> · 226 registered source lines · L226 empty terminator · story coverage complete through L225</div>
<iframe id="partView" title="Episode 01 part view"></iframe>
<script>
const buttons=[...document.querySelectorAll('.parts button')],frame=document.getElementById('partView'),valid=new Set(buttons.map(b=>b.dataset.key));
function currentKey(){return buttons.find(b=>b.classList.contains('active'))?.dataset.key||'part1'}
const BUILD_REV='e01-p9p11-progression-b6fc8452-8c30a5ab-ba0d3d89-r1';
function openPart(key){if(!valid.has(key))key='part1';const button=buttons.find(b=>b.dataset.key===key);buttons.forEach(b=>b.classList.toggle('active',b===button));const src=/^part\d+$/.test(key)?button.dataset.file+'?v='+BUILD_REV:button.dataset.file;if(frame.getAttribute('src')!==src)frame.src=src;history.replaceState(null,'','#'+key)}
buttons.forEach(b=>b.addEventListener('click',()=>openPart(b.dataset.key)));
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument,key=currentKey();if(key.startsWith('part')){['Scope / Status','QA'].forEach(name=>{doc.querySelector(`nav button[data-tab="${name}"]`)?.remove();doc.querySelector(`.panel[data-panel="${name}"]`)?.remove();});const hash=decodeURIComponent(doc.location.hash.slice(1));if(hash==='Scope / Status'||hash==='QA'){doc.querySelector('nav button[data-tab="40/40 Reading"]')?.click();}}
const resize=()=>frame.style.height=Math.max(900,doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px';resize();new ResizeObserver(resize).observe(doc.body);doc.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a){const href=a.getAttribute('href');const map={'prologue.html':'prologue','part1.html':'part1','part2.html':'part2','part3.html':'part3','part4.html':'part4','part5.html':'part5','part6.html':'part6','part7.html':'part7','part8.html':'part8','part9.html':'part9','part10.html':'part10','part11.html':'part11','part12.html':'part12','index.html':'part1','./':'part1'};if(map[href]){e.preventDefault();openPart(map[href]);return}}setTimeout(resize,50)});}catch(e){}});
openPart(location.hash.slice(1)||'part1');
</script>
</body></html>
