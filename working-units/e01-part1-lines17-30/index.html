<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHIKA Story Engine · E01 Review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#24302b;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{background:#1d332b;color:#fff;padding:20px 24px}h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#cbd8d2;font-size:13px}.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.parts button{border:1px solid #507166;background:#29473c;color:#fff;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}.parts button.active{background:#fff;color:#1d332b}.status{padding:9px 24px;background:#ebe6da;border-bottom:1px solid #d9d2c4;font-size:12px;color:#59645f}.status b{color:#315b4c}iframe{display:block;width:100%;min-height:900px;border:0;background:#f5f2e9}
</style>
</head>
<body>
<header>
<h1>DHIKA Story Engine · Episode 01</h1>
<p>Frozen pages stay untouched. Only the currently working part is edited.</p>
<div class="parts">
<button data-file="prologue.html" data-key="prologue">Prologue · FINAL</button>
<button data-file="part1.html" data-key="part1">Part 1 · L17–30 · FINAL</button>
<button data-file="part2.html" data-key="part2">Part 2 · L31–64 · WORKING</button>
</div>
</header>
<div class="status">Architecture: <b>index.html = router only</b> · Prologue = frozen component · Part 1 = frozen component · Part 2 = active component</div>
<iframe id="partView" title="Episode 01 part view"></iframe>
<script>
const buttons=[...document.querySelectorAll('.parts button')];
const frame=document.getElementById('partView');
const valid=new Set(buttons.map(b=>b.dataset.key));
function openPart(key){
  if(!valid.has(key)) key='part2';
  const button=buttons.find(b=>b.dataset.key===key);
  buttons.forEach(b=>b.classList.toggle('active',b===button));
  if(frame.getAttribute('src')!==button.dataset.file) frame.src=button.dataset.file;
  history.replaceState(null,'','#'+key);
}
buttons.forEach(b=>b.addEventListener('click',()=>openPart(b.dataset.key)));
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const resize=()=>frame.style.height=Math.max(900,doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px';
    resize();
    new ResizeObserver(resize).observe(doc.body);
    doc.addEventListener('click',()=>setTimeout(resize,50));
  }catch(e){}
});
openPart(location.hash.slice(1)||'part2');
</script>
</body>
</html>
