<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHIKA Story Engine — E01</title><style>body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:680px;padding:28px;border:1px solid #334155;border-radius:16px;background:#111827}.muted{color:#94a3b8}.err{color:#fca5a5;white-space:pre-wrap}</style></head><body><div class="box" id="status"><strong>Loading reviewed Episode 01 UI…</strong><div class="muted">Story + Images review through Line 200</div></div><script>(async()=>{try{const paths=['patch/review-l040-l200-01.gz','patch/review-l040-l200-02.gz','patch/review-l040-l200-03.gz','patch/review-l040-l200-04.gz'],parts=[];for(const p of paths){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`Missing reviewed UI part: ${p} (${r.status})`);if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support gzip decompression.');const stream=r.body.pipeThrough(new DecompressionStream('gzip'));parts.push(await new Response(stream).text());}const html=parts.join('');document.open();document.write(html);document.close();}catch(e){document.getElementById('status').innerHTML='<strong>Unable to load reviewed E01 UI</strong><div class="err"></div>';document.querySelector('.err').textContent=String(e&&e.stack||e);}})();</script></body></html>
