<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DHIKA Story Engine — E01</title>
  <style>
    body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}
    .box{max-width:680px;padding:28px;border:1px solid #334155;border-radius:16px;background:#111827;box-shadow:0 20px 60px #0005}
    .muted{color:#94a3b8}.err{color:#fca5a5;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box" id="status"><strong>Loading Episode 01 review UI…</strong><div class="muted">Static GitHub Pages build</div></div>
  <script>
  (async()=>{
    try{
      const count=10, parts=[];
      for(let i=1;i<=count;i++){
        const n=String(i).padStart(3,'0');
        const r=await fetch(`payload/part-${n}.txt`,{cache:'no-store'});
        if(!r.ok) throw new Error(`Missing payload part ${n} (${r.status})`);
        parts.push((await r.text()).trim());
      }
      const b64=parts.join('');
      const bin=atob(b64), bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression. Please use a current Chrome/Edge/Safari/Firefox build.');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open(); document.write(html); document.close();
    }catch(e){
      document.getElementById('status').innerHTML='<strong>Unable to load E01 UI</strong><div class="err"></div>';
      document.querySelector('.err').textContent=String(e && e.stack || e);
    }
  })();
  </script>
</body>
</html>
