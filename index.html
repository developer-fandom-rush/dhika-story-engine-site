<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DHIKA Story Engine — E01</title>
  <style>
    body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}
    .box{max-width:680px;padding:28px;border:1px solid #334155;border-radius:16px;background:#111827;box-shadow:0 20px 60px #0005}
    .muted{color:#94a3b8}.err{color:#fca5a5;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box" id="status"><strong>Loading Episode 01 review UI…</strong><div class="muted">Static GitHub Pages build</div></div>
  <script>
  (async()=>{
    try{
      const count=10,parts=[];
      for(let i=1;i<=count;i++){
        const n=String(i).padStart(3,'0');
        const r=await fetch(`payload/part-${n}.txt`,{cache:'no-store'});
        if(!r.ok) throw new Error(`Missing payload part ${n} (${r.status})`);
        parts.push((await r.text()).trim());
      }
      const b64=parts.join('');
      const bin=atob(b64),bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression.');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html=await new Response(stream).text();

      const css=`
.prologue-wrap{margin:18px 0 26px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.prologue-head{padding:16px 18px;background:var(--tint);border-bottom:1px solid var(--line)}
.prologue-head h3{margin:0 0 4px;font:600 20px Georgia,serif;color:var(--green)}
.prologue-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 290px}
.prologue-col,.dhika-ref{padding:16px 18px}.prologue-col{border-right:1px solid var(--line)}
.prologue-label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:700;margin-bottom:10px}
.prologue-note{font-size:12px;color:var(--muted);margin:0}.dhika-ref img{width:100%;display:block;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
.dhika-ref h4{font:600 19px Georgia,serif;margin:0 0 8px}.dhika-ref dl{display:grid;grid-template-columns:110px 1fr;gap:5px 8px;margin:0}
.dhika-ref dt{color:var(--muted);font-size:12px}.dhika-ref dd{margin:0;font-size:13px}.visual-inference{margin-top:12px;padding:10px;border-left:3px solid var(--gold);background:#f4edde;font-size:12px}
.story-start{margin:12px 0 8px;font-weight:700;color:var(--green)}
.story-images-intro{margin-bottom:18px;padding:13px 15px;border-left:3px solid var(--gold);background:#f4edde;border-radius:0 8px 8px 0;font-size:12px}
.story-visual-card{border:1px solid var(--line);background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 20px}
.story-visual-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:15px 18px;background:var(--tint);border-bottom:1px solid var(--line)}
.story-visual-head h3{margin:0}.story-visual-body{display:grid;grid-template-columns:minmax(0,.95fr) minmax(340px,1.35fr);gap:0}
.story-local{padding:18px;border-right:1px solid var(--line)}.story-local .translate{font-size:15px;line-height:1.9}
.story-local .translate+.translate{margin-top:12px}.story-media{padding:18px;background:#fbfaf6}
.story-media img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.story-caption{font-size:12px;color:var(--muted);margin:8px 2px 0}.story-pending{display:grid;place-items:center;min-height:170px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;padding:22px;background:#faf9f4}
.story-source-ref{font-size:11px;color:var(--muted);margin-top:10px}.story-visual-head .range{white-space:nowrap}
.story-fixed{margin:-6px 0 18px;padding:10px 13px;border:1px solid #b9d9c7;background:#edf8f1;color:#244d3e;border-radius:9px;font-size:12px;font-weight:650}.story-brief{min-height:170px;border:1px dashed var(--gold);border-radius:10px;padding:18px;background:#fffaf0;color:var(--ink)}.story-brief strong{display:block;color:var(--gold);margin-bottom:7px}.story-brief small{display:block;color:var(--muted);margin-top:9px}
@media(max-width:1000px){.prologue-grid{grid-template-columns:1fr 1fr}.dhika-ref{grid-column:1/-1;border-top:1px solid var(--line)}.prologue-col:nth-child(2){border-right:0}.story-visual-body{grid-template-columns:1fr}.story-local{border-right:0;border-bottom:1px solid var(--line)}}
@media(max-width:680px){.prologue-grid{grid-template-columns:1fr}.prologue-col{border-right:0;border-bottom:1px solid var(--line)}.dhika-ref{grid-column:auto}.story-visual-head{display:block}.story-visual-head .range{margin-top:8px}}
`;
      html=html.replace('</style>',css+'</style>');

      function patchRuntime(){
        const dhikaImage='assets/images/e01/characters/dhika-reference.webp';
        const scene1718='assets/images/e01/scenes/e01-l017-018.webp';

        const reviewFixes={
          'E01-L019-021':{
            translation:`Uncle retired military veteran the. Halaanki Dhika ko pata nahi tha ki military mein unki position kya thi, kyunki ghar mein toh Aunty hi unhe sergeant ki tarah idhar-udhar drill karwati rehti thi.\nAunty aur Uncle dono apne early 60s mein the. Bagal mein rehne wala yeh joda Dhika aur John ke liye lagbhag doosre guardians jaisa tha. Unki apni koi aulaad nahi thi; Aunty Dhika aur John ko apne bachchon ki tarah maanti thi. Uncle ke liye Dhika us family-jaisi equation se thodi zyada thi. Unki shaadishuda zindagi feeki pad chuki thi, aur bagal mein Dhika jaisi khoobsurat ladki rehti thi… use taadne ka koi mauka woh nahi chhodte the.\nLekin unhone Dhika ya John ko iska pata nahi chalne diya tha—aur khaaskar apni patni ko toh bilkul nahi.`,
            samajh:'Publicly family-like neighbour trust hai; privately Uncle ki hidden attraction hai. Dhika unki exact military rank nahi jaanti, aur Dhika, John aur Aunty ko Uncle ke hidden interest ka pata nahi hai.',
            tags:['Characters','Relationships','Knowledge','Style']
          },
          'E01-L022-025':{
            samajh:'Aunty neeche gayi hain; Uncle Pappu ko lene ki zimmedari lete hain aur Dhika unhe child handoff karti hai.',
            tags:['Relationships','Sequences','Knowledge']
          },
          'E01-L026-030':{
            translation:`Dhika: Maine Pappu ka doodh fridge mein rakh diya hai.\nDhika: Aur jab woh uth jaaye toh… *\nUncle: Samajh gaya, Dhika. Chinta mat karo.\nDhika: Phir se thanks, Uncle… mujhe der ho rahi hai… Aunty ko bata dijiyega…\nUski baat poori hoti, usse pehle hi Dhika seedhiyon se neeche gayab ho chuki thi.`,
            samajh:'Dhika milk aur childcare context Uncle ko dekar, Aunty ko inform karne ko kehti hai aur late hone ki wajah se jaldi nikal jaati hai.',
            tags:['Sequences','Hooks','Knowledge','Pace']
          },
          'E01-L031-035':{
            samajh:'08:35 college parking mein Bantu ki familiar compliment par Dhika blush karti hai, speaker ko mudne se pehle pehchan leti hai aur chahti hai ki koi aur aas-paas na ho.',
            tags:['Characters','Relationships','Style','Visibility','Knowledge']
          },
          'E01-L036-039':{
            samajh:'Bantu aur Bobby ko Dhika ke saath specific social chhoot hai; Dhika Bobby ko thodi door bike dhakka dete dekhkar wave karti hai.',
            tags:['Characters','Relationships','Consent','Visibility']
          }
        };
        for(const [id,fix] of Object.entries(reviewFixes)){
          const e=data.decodeBlocks.find(x=>x.id===id); if(!e) continue;
          if(fix.translation)e.translation=fix.translation;
          if(fix.samajh)e.samajh=fix.samajh;
          if(fix.tags)e.mapping.moduleTags=fix.tags;
          e.reviewStatus='FIXED_CANDIDATE';
        }

        if(!tabs.includes('Story + Images')) tabs.splice(2,0,'Story + Images');
        descriptions['Story + Images']='Local-language story flow with approved visual references. Analytical 40/40/20 remains separate and uncluttered.';

        const baseReading=reading;
        reading=function(parent){
          baseReading(parent);
          const rows=['E01-L001-012','E01-L013-013','E01-L014-016'];
          for(const id of rows){const n=document.getElementById('block-'+id);if(n)n.style.display='none';}
          const scroll=parent.querySelector('.read-scroll');
          if(!scroll||parent.querySelector('#prologue-general'))return;
          const prologueBlocks=data.decodeBlocks.filter(e=>e.sourceRange.end<=16);
          const wrap=document.createElement('section');wrap.className='prologue-wrap';wrap.id='prologue-general';
          const head=document.createElement('div');head.className='prologue-head';
          head.innerHTML='<h3>Prologue / General Context · Lines 1–16</h3><p class="prologue-note">General episode wrapper, title/profile, introductory context, source notes and section heading. Kept outside the 40/40/20 story-review categorization. Episode review starts at Line 17.</p>';
          const grid=document.createElement('div');grid.className='prologue-grid';
          const original=document.createElement('div');original.className='prologue-col';original.innerHTML='<div class="prologue-label">Original / read only</div>';
          for(let i=1;i<=16;i++){const line=document.createElement('div');line.className='source-line';const ln=document.createElement('span');ln.className='ln';ln.textContent=String(i);const lit=document.createElement('span');lit.className='literal';lit.textContent=data.source.episodeLines[i-1]||'\u200b';line.append(ln,lit);original.append(line);}
          const local=document.createElement('div');local.className='prologue-col';local.innerHTML='<div class="prologue-label">Complete local transformation</div>';
          for(const e of prologueBlocks){const d=document.createElement('div');d.className='translate';d.textContent=e.translation;local.append(d);}
          const ref=document.createElement('aside');ref.className='dhika-ref';
          ref.innerHTML='<div class="prologue-label">Character visual reference</div><img alt="Fictional Dhika visual reference" src="'+dhikaImage+'"><h4>Dhika</h4><dl><dt>Source age</dt><dd>29</dd><dt>Source height</dt><dd>5\'6\"</dd><dt>Source weight</dt><dd>56 kg</dd><dt>Visual reference</dt><dd>36–28–38 in · slim, softly curvy</dd></dl><div class="visual-inference"><strong>Visual-reference only:</strong> body measurements are inferred for image consistency; they are not stated by the source.</div>';
          grid.append(original,local,ref);wrap.append(head,grid);scroll.before(wrap);
          const start=document.createElement('div');start.className='story-start';start.textContent='Story review begins below at Line 17.';scroll.before(start);
        };

        function storyImages(parent){
          title(parent,'Story + Images');
          const intro=document.createElement('div');intro.className='story-images-intro';
          intro.textContent='This is the visual reading layer. It keeps narrative images away from the 20% decoding column. Source text remains unchanged in the 40/40/20 view.';
          parent.append(intro);
          const fixed=document.createElement('div');fixed.className='story-fixed';fixed.textContent='FIXED CANDIDATE · Source untouched · translation/tag audit applied through Line 39. Story visuals remain separate from the 20% decoding column.';parent.append(fixed);

          const prologueBlocks=data.decodeBlocks.filter(e=>e.sourceRange.end<=16);
          const prologue=document.createElement('section');prologue.className='story-visual-card';
          const ph=document.createElement('div');ph.className='story-visual-head';ph.append(el('h3','','Prologue / General Context'));
          ph.append(btn('Open source · L1–16',()=>goRange(1,16),'range'));
          const pb=document.createElement('div');pb.className='story-visual-body';
          const pl=document.createElement('div');pl.className='story-local';pl.append(el('div','prologue-label','Local-language reading'));
          for(const e of prologueBlocks){pl.append(el('div','translate',e.translation));}
          pl.append(el('div','story-source-ref','Source reference: Episode 01 · Lines 1–16'));
          const pm=document.createElement('div');pm.className='story-media';
          const pimg=document.createElement('img');pimg.src=dhikaImage;pimg.alt='Dhika character reference for the Episode 01 prologue';
          pm.append(pimg,el('div','story-caption','Prologue reference · Dhika visual identity'));
          pb.append(pl,pm);prologue.append(ph,pb);parent.append(prologue);

          function addChunk(id,imageSrc,caption,visualBrief){
            const e=data.decodeBlocks.find(x=>x.id===id);if(!e)return;
            const card=document.createElement('section');card.className='story-visual-card';
            const h=document.createElement('div');h.className='story-visual-head';h.append(el('h3','',`Lines ${e.sourceRange.start}–${e.sourceRange.end}`));
            h.append(btn(`Open source · L${e.sourceRange.start}–${e.sourceRange.end}`,()=>goRange(e.sourceRange.start,e.sourceRange.end),'range'));
            const body=document.createElement('div');body.className='story-visual-body';
            const local=document.createElement('div');local.className='story-local';local.append(el('div','prologue-label','Local-language story'),el('div','translate',e.translation),el('div','story-source-ref',`Source reference: ${e.id} · ${e.reviewStatus==='FIXED_CANDIDATE'?'FIXED CANDIDATE':'review candidate'}`));
            const media=document.createElement('div');media.className='story-media';
            if(imageSrc){const img=document.createElement('img');img.src=imageSrc;img.alt=caption;media.append(img,el('div','story-caption',caption));}
            else{const pending=document.createElement('div');pending.className='story-brief';pending.innerHTML='<strong>Visual brief ready</strong>'+visualBrief+'<small>Single-scene asset only; no collage/UI image should be inserted here.</small>';media.append(pending);}
            body.append(local,media);card.append(h,body);parent.append(card);
          }

          addChunk('E01-L017-018',scene1718,'Lines 17–18 · Dhika arrives at the next-door doorway carrying sleeping Pappu; Uncle is present and Aunty is not visible.','');
          addChunk('E01-L019-021','','','Early-60s Aunty and Uncle in their next-door home with Dhika in a familiar neighbour setting. Public family-like comfort is visible; Uncle’s private attention is only a subtle glance and nobody reacts to it.');
          addChunk('E01-L022-025','','','Dhika in the same pink cotton saree hands sleeping Pappu to Uncle at the next-door doorway/interior. Uncle accepts the child; Aunty is absent.');
          addChunk('E01-L026-030','','','Uncle remains near the doorway with Pappu while Dhika, handbag on shoulder, hurries down the apartment stairs and calls back to inform Aunty.');
          addChunk('E01-L031-035','','','08:35 college parking. Dhika stands beside her bike in the same pink cotton saree. Adult student Bantu is behind her giving a familiar compliment; she blushes and glances around to check whether anyone else is nearby.');
          addChunk('E01-L036-039','','','Same college parking. Bantu stands near Dhika while she turns and waves to adult student Bobby farther away, who is struggling to push his bike.');
        }

        render=function(){
          const nav=$('nav');nav.replaceChildren();
          for(const tab of tabs){let b=btn(tab,()=>show(tab),state.tab===tab?'active':'');b.setAttribute('aria-current',state.tab===tab?'page':'false');nav.append(b);}
          const parent=$('content');parent.replaceChildren();
          if(state.tab==='Overview')overview(parent);
          else if(state.tab==='40/40/20 Reading')reading(parent);
          else if(state.tab==='Story + Images')storyImages(parent);
          else if(state.tab==='Reader Questions')questions(parent);
          else moduleView(parent);
        };
        render();
      }

      const patch='('+patchRuntime.toString()+')();';
      html=html.replace('</body>','<script>'+patch+'<\/script></body>');
      document.open();document.write(html);document.close();
    }catch(e){
      document.getElementById('status').innerHTML='<strong>Unable to load E01 UI</strong><div class="err"></div>';
      document.querySelector('.err').textContent=String(e&&e.stack||e);
    }
  })();
  </script>
</body>
</html>
